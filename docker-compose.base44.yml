services:
  postgres:
    image: postgres:16-alpine
    container_name: digital-passport-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: digital_passport
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: node:20-slim
    container_name: digital-passport-app
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: >
      bash -c "apt-get update && apt-get install -y --no-install-recommends openssl ca-certificates &&
      npm install --legacy-peer-deps &&
      npx prisma generate &&
      npx prisma db push &&
      npx --yes tsx prisma/seed.ts &&
      npx next dev -H 0.0.0.0 -p 3000"

volumes:
  postgres_data:
